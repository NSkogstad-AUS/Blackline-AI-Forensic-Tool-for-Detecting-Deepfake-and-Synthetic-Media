name: Integration Tests

on:
  workflow_dispatch: {}
  schedule:
    # daily at 03:00 UTC
    - cron: '0 3 * * *'

jobs:
  integration:
    name: Integration tests (heavy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.11-

      - name: Install full dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run integration tests
        run: |
          # run only tests marked as integration
          pytest -q backend/tests -m integration --junitxml=pytest-integration-results.xml

      - name: Upload integration pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-integration-results
          path: pytest-integration-results.xml

      - name: Upload test logs (fallback)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-logs
          path: backend/tests